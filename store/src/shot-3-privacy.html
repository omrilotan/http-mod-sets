<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="frame.css" />
    <style>
      body { width: 1280px; height: 800px; }
      .canvas { height: 800px; padding: 0 100px; gap: 90px; }
      .shield { flex-shrink: 0; width: 360px; height: 360px; display: grid; place-items: center; border-radius: 50%;
        background: radial-gradient(circle, rgba(60, 199, 119, 0.22), rgba(60, 199, 119, 0.02) 70%); }
      .shield svg { width: 190px; height: 190px; fill: none; stroke: var(--ok); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      ul { list-style: none; margin: 30px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 30px; max-width: 560px; }
      li { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; }
      li svg { width: 26px; height: 26px; fill: none; stroke: var(--ok); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .note { margin-top: 36px; font-size: 18px; color: var(--muted); max-width: 560px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="copy">
        <div class="eyebrow"><img src="../../icons/icon-128.png" alt="" /> HTTP Mod Sets</div>
        <h1>We collect<br /><em>nothing.</em></h1>
        <ul>
          <li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" /></svg>No analytics</li>
          <li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" /></svg>No accounts</li>
          <li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" /></svg>No third parties</li>
          <li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" /></svg>No servers</li>
        </ul>
        <p class="note">Your rules stay in your browser. Edited requests go only where they were already going. Open source, so you can check.</p>
      </div>
      <div class="shield">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6l8-3z" /><rect x="8.5" y="11" width="7" height="5.5" rx="1" /><path d="M10 11V9.3a2 2 0 0 1 4 0V11" /></svg>
      </div>
    </div>
  </body>
</html>
